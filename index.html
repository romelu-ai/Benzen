<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>芳香族化合物の反応系統図</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root {
  --bg:#0a0e1a; --panel:#111827; --card:#1a2235; --card-hover:#1e2a40;
  --border:#2a3550; --accent:#4f9cf9; --accent2:#f97316; --accent3:#34d399;
  --accent4:#a78bfa; --text:#e2e8f0; --text-dim:#94a3b8; --text-faint:#4a5568;
  --highlight:#fbbf24;
  --header-h: 52px;
  --bottom-h: 56px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;}

/* ===== HEADER ===== */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:linear-gradient(135deg,#0f172a,#1e1b4b 50%,#0f172a);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;z-index:200;
}
.header h1{
  font-size:14px;font-weight:700;white-space:nowrap;
  background:linear-gradient(90deg,#4f9cf9,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-btns{display:flex;gap:6px;align-items:center;}
.btn{
  padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text-dim);font-size:11px;cursor:pointer;
  transition:all .15s;font-family:inherit;white-space:nowrap;
}
.btn:active,.btn.active{background:#1e3a5f;color:var(--accent);border-color:var(--accent);}
.mode-badge{
  padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;
  background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.3);
  white-space:nowrap;
}

/* ===== MAP AREA ===== */
.map-wrap{
  position:fixed;
  top:var(--header-h);left:0;right:0;
  bottom:var(--bottom-h);
  overflow:hidden;
  background:var(--bg);
}
.map-pan{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  cursor:grab;
  will-change:transform;
}
.map-pan:active{cursor:grabbing;}
.map-canvas{
  position:relative;
  width:1440px;height:1120px;
}
.arrows-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

/* ===== NODES ===== */
.node{
  position:absolute;background:var(--card);border:1.5px solid var(--border);
  border-radius:10px;padding:6px 8px;cursor:pointer;
  transition:box-shadow .2s,border-color .2s,opacity .2s;
  min-width:82px;max-width:110px;text-align:center;z-index:10;
  user-select:none;touch-action:none;
}
.node:active,.node:hover{z-index:20;}
.node.active{border-color:var(--accent);background:#1a2f50;box-shadow:0 0 0 3px rgba(79,156,249,0.3),0 6px 20px rgba(79,156,249,0.25);z-index:30;}
.node.highlighted{border-color:var(--accent3);box-shadow:0 0 0 2px rgba(52,211,153,0.3);}
.node.dimmed{opacity:.25;}
.node-struct{width:60px;height:50px;margin:0 auto 2px;}
.node-struct svg{width:100%;height:100%;}
.node-num{font-size:8px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;margin-bottom:1px;}
.node-name{font-size:10px;font-weight:700;color:var(--text);line-height:1.25;}
.node.quiz-hidden .node-name{background:var(--border);color:transparent;border-radius:3px;}
.node.quiz-revealed .node-name{color:var(--highlight);}

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--bottom-h);
  background:var(--panel);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;
  z-index:200;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 10px;border-radius:8px;cursor:pointer;
  color:var(--text-faint);font-size:9px;border:none;background:none;
  font-family:inherit;transition:all .15s;min-width:52px;
}
.nav-btn .nav-icon{font-size:18px;}
.nav-btn.active{color:var(--accent);background:rgba(79,156,249,0.1);}

/* ===== BOTTOM SHEET (detail / list) ===== */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.bottom-sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--panel);border-radius:16px 16px 0 0;
  border-top:1px solid var(--border);
  max-height:75vh;overflow-y:auto;
  z-index:400;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.bottom-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px;}
.sheet-title{font-size:13px;font-weight:700;padding:0 16px 12px;border-bottom:1px solid var(--border);}

/* Detail sheet content */
.detail-wrap{padding:16px;}
.detail-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.detail-struct{width:80px;height:70px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px;}
.detail-struct svg{width:100%;height:100%;}
.detail-info{}
.detail-num{font-size:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-bottom:3px;}
.detail-name{font-size:16px;font-weight:700;line-height:1.3;margin-bottom:3px;}
.detail-formula{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
.detail-desc{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:12px;}
.detail-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:6px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.chip{padding:3px 8px;border-radius:20px;font-size:10px;background:var(--card);border:1px solid var(--border);color:var(--text-dim);}
.reaction-card{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:9px 11px;margin-bottom:7px;cursor:pointer;
}
.reaction-card:active{border-color:var(--accent2);}
.reaction-compound{color:var(--accent);font-weight:700;font-size:12px;}
.reaction-reagent{font-size:10px;color:var(--text-dim);margin-top:3px;font-family:'JetBrains Mono',monospace;}
.reaction-type{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;margin-top:4px;}

/* List sheet */
.compound-list-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;
}
.compound-list-item:active{background:var(--card-hover);}
.compound-list-item.selected{background:#1e3a5f;}
.cli-num{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.cli-struct{width:36px;height:32px;flex-shrink:0;}
.cli-struct svg{width:100%;height:100%;}
.cli-name{font-size:12px;font-weight:600;color:var(--text);flex:1;}

/* Reaction type colors */
.type-置換{background:rgba(79,156,249,.15);color:#4f9cf9;}
.type-ニトロ化{background:rgba(249,115,22,.15);color:#f97316;}
.type-スルホン化{background:rgba(52,211,153,.15);color:#34d399;}
.type-還元{background:rgba(167,139,250,.15);color:#a78bfa;}
.type-酸化{background:rgba(251,191,36,.15);color:#fbbf24;}
.type-中和{background:rgba(244,114,182,.15);color:#f472b6;}
.type-エステル化{background:rgba(45,212,191,.15);color:#2dd4bf;}
.type-アセチル化{background:rgba(251,113,133,.15);color:#fb7185;}
.type-ジアゾ化{background:rgba(99,102,241,.15);color:#818cf8;}
.type-付加{background:rgba(234,179,8,.15);color:#eab308;}
.type-付加重合{background:rgba(234,179,8,.15);color:#eab308;}
.type-縮合重合{background:rgba(234,179,8,.15);color:#eab308;}
.type-アルキル化{background:rgba(16,185,129,.15);color:#10b981;}
.type-アルカリ融解{background:rgba(239,68,68,.15);color:#ef4444;}
.type-弱酸遊離{background:rgba(20,184,166,.15);color:#14b8a6;}
.type-弱塩基遊離{background:rgba(20,184,166,.15);color:#14b8a6;}
.type-ジアゾカップリング{background:rgba(99,102,241,.15);color:#818cf8;}
.type-酸化開裂{background:rgba(251,191,36,.15);color:#fbbf24;}
.type-加水分解{background:rgba(96,165,250,.15);color:#60a5fa;}
.type-分子内脱水{background:rgba(156,163,175,.15);color:#9ca3af;}
.type-分解{background:rgba(239,68,68,.15);color:#ef4444;}

/* Landscape: side panel instead of bottom sheet */
@media (orientation:landscape) and (max-height:500px) {
  :root{--header-h:44px;--bottom-h:0px;}
  .bottom-nav{display:none;}
  .map-wrap{bottom:0;}
  .side-panel{
    position:fixed;top:var(--header-h);right:0;bottom:0;
    width:260px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;z-index:150;
    transform:translateX(100%);transition:transform .25s;
  }
  .side-panel.open{transform:translateX(0);}
  .panel-toggle{
    position:fixed;top:calc(var(--header-h) + 8px);right:0;
    background:var(--card);border:1px solid var(--border);border-right:none;
    border-radius:6px 0 0 6px;padding:8px 6px;cursor:pointer;z-index:160;
    font-size:12px;color:var(--text-dim);writing-mode:vertical-rl;
    transition:right .25s;
  }
  .map-wrap.panel-open{right:260px;}
  .bottom-sheet,.sheet-overlay{display:none !important;}
}
/* Desktop */
@media (min-width:768px) and (orientation:landscape) and (min-height:501px){
  :root{--bottom-h:0px;}
  .bottom-nav{display:none;}
  .map-wrap{bottom:0;}
  .desktop-sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;
    width:220px;background:var(--panel);border-right:1px solid var(--border);
    overflow-y:auto;z-index:150;
  }
  .desktop-detail{
    position:fixed;top:var(--header-h);right:0;bottom:0;
    width:300px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;z-index:150;padding:16px;
  }
  .map-wrap{left:220px;right:300px;}
  .bottom-sheet,.sheet-overlay{display:none !important;}
  .panel-toggle,.side-panel{display:none !important;}
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#2a3550;border-radius:2px;}
</style>
</head>
<body>

<div class="header">
  <h1>🧪 芳香族 反応系統図</h1>
  <div class="header-btns">
    <span class="mode-badge" id="modeBadge">閲覧</span>
    <button class="btn" id="quizBtn" onclick="toggleQuiz()">📝 穴埋め</button>
    <button class="btn" onclick="resetView()">↺</button>
  </div>
</div>

<!-- Map -->
<div class="map-wrap" id="mapWrap">
  <div class="map-pan" id="mapPan">
    <div class="map-canvas" id="mapCanvas">
      <svg class="arrows-svg" id="arrowsSvg">
        <defs>
          <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2a3550"/></marker>
          <marker id="arr-a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#4f9cf9"/></marker>
          <marker id="arr-t" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker>
        </defs>
      </svg>
    </div>
  </div>
</div>

<!-- Bottom nav (mobile portrait) -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" id="navMap" onclick="switchTab('map')">
    <span class="nav-icon">🗺️</span>マップ
  </button>
  <button class="nav-btn" id="navList" onclick="switchTab('list')">
    <span class="nav-icon">📋</span>一覧
  </button>
  <button class="nav-btn" id="navDetail" onclick="switchTab('detail')">
    <span class="nav-icon">🔬</span>詳細
  </button>
  <button class="nav-btn" id="navQuiz" onclick="toggleQuiz()">
    <span class="nav-icon">📝</span>穴埋め
  </button>
</div>

<!-- Sheet overlay -->
<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>

<!-- Bottom sheet (shared) -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" onclick="closeSheet()"></div>
  <div class="sheet-title" id="sheetTitle"></div>
  <div id="sheetBody"></div>
</div>

<!-- Landscape side panel -->
<div class="side-panel" id="sidePanel">
  <div style="padding:12px" id="sidePanelBody"></div>
</div>
<div class="panel-toggle" id="panelToggle" onclick="toggleSidePanel()">詳細 ▶</div>

<!-- Desktop sidebar -->
<div class="desktop-sidebar" id="desktopSidebar" style="display:none">
  <div style="padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);border-bottom:1px solid var(--border)">化合物一覧</div>
  <div id="desktopList"></div>
</div>
<!-- Desktop detail -->
<div class="desktop-detail" id="desktopDetail" style="display:none">
  <div style="color:var(--text-faint);font-size:12px;text-align:center;padding-top:40px;">化合物をクリック</div>
</div>

// ===================== LAYOUT DETECTION =====================
function isDesktop() { return window.innerWidth >= 768 && window.innerHeight > 500 && window.innerWidth > window.innerHeight; }
function isLandscapeMobile() { return !isDesktop() && window.innerWidth > window.innerHeight && window.innerHeight < 500; }
function isPortrait() { return window.innerHeight >= window.innerWidth || window.innerWidth < 768; }

function setupLayout() {
  const desktop = isDesktop();
  const lm = isLandscapeMobile();
  document.getElementById('desktopSidebar').style.display = desktop ? 'block' : 'none';
  document.getElementById('desktopDetail').style.display = desktop ? 'block' : 'none';
  document.getElementById('panelToggle').style.display = lm ? 'block' : 'none';
  if (desktop) {
    renderDesktopList();
    if (selectedId) renderDesktopDetail(selectedId);
  }
}

// ===================== RENDER NODES =====================
function getStruct(id) { return structs[id] || structs[1]; }

function renderNodes() {
  const canvas = document.getElementById('mapCanvas');
  // Remove old nodes
  canvas.querySelectorAll('.node').forEach(el => el.remove());

  compounds.forEach(c => {
    const div = document.createElement('div');
    div.className = 'node';
    div.id = 'node-' + c.id;
    div.style.left = c.x + 'px';
    div.style.top = c.y + 'px';
    const color = catColors[c.cat] || '#4f9cf9';
    div.style.borderColor = color + '66';

    div.innerHTML = `
      <div class="node-struct">${getStruct(c.id)}</div>
      <div class="node-num">#${c.id}</div>
      <div class="node-name">${c.name.replace('\n','<br>')}</div>
    `;
    div.addEventListener('pointerdown', e => e.stopPropagation());
    div.addEventListener('click', e => { e.stopPropagation(); selectCompound(c.id); });
    canvas.appendChild(div);
  });
}

// ===================== ARROWS =====================
function renderArrows() {
  const svg = document.getElementById('arrowsSvg');
  while (svg.children.length > 1) svg.removeChild(svg.lastChild);

  reactions.forEach(r => {
    const fromC = compounds.find(c => c.id === r.from);
    const toC = compounds.find(c => c.id === r.to);
    if (!fromC || !toC) return;
    const fromEl = document.getElementById('node-' + fromC.id);
    const toEl = document.getElementById('node-' + toC.id);
    if (!fromEl || !toEl) return;

    const fw = fromEl.offsetWidth, fh = fromEl.offsetHeight;
    const tw = toEl.offsetWidth, th = toEl.offsetHeight;
    const fx = fromC.x + fw/2, fy = fromC.y + fh/2;
    const tx = toC.x + tw/2, ty = toC.y + th/2;
    const dx = tx-fx, dy = ty-fy;
    const len = Math.sqrt(dx*dx+dy*dy) || 1;
    const sr = Math.max(fw,fh)/2 * 0.85;
    const er = Math.max(tw,th)/2 * 0.85;
    const sx = fx+(dx/len)*sr, sy = fy+(dy/len)*sr;
    const ex = tx-(dx/len)*er, ey = ty-(dy/len)*er;
    const mx=(sx+ex)/2, my=(sy+ey)/2;
    const cpx=mx-(dy/len)*18, cpy=my+(dx/len)*18;

    const isFrom = selectedId===fromC.id, isTo = selectedId===toC.id;
    const related = isFrom||isTo;
    const color = isFrom?'#4f9cf9':isTo?'#34d399':'#2a3550';
    const width = related?'2.5':'1.5';
    const marker = isFrom?'url(#arr-a)':isTo?'url(#arr-t)':'url(#arr)';
    const opacity = selectedId&&!related?'0.1':'0.65';

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${sx} ${sy} Q ${cpx} ${cpy} ${ex} ${ey}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke',color);
    path.setAttribute('stroke-width',width);
    path.setAttribute('marker-end',marker);
    path.setAttribute('opacity',opacity);
    g.appendChild(path);

    if (related) {
      const lx=(sx+ex)/2, ly=(sy+ey)/2-8;
      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',lx); txt.setAttribute('y',ly);
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('font-size','9');
      txt.setAttribute('fill',color);
      txt.setAttribute('font-family','Noto Sans JP,sans-serif');
      txt.textContent = r.type;
      g.appendChild(txt);
    }
    svg.appendChild(g);
  });
}

// ===================== SELECT =====================
function selectCompound(id) {
  if (quizMode) quizRevealed.add(id);
  selectedId = id === selectedId ? null : id;
  updateNodes();
  renderArrows();

  if (isDesktop()) {
    renderDesktopDetail(selectedId);
    renderDesktopList();
  } else if (isLandscapeMobile()) {
    if (selectedId) { renderSidePanel(selectedId); openSidePanel(); }
    else closeSidePanel();
  } else {
    // portrait mobile
    if (selectedId) { openSheet('detail', selectedId); }
    else closeSheet();
    document.getElementById('navDetail').classList.toggle('active', !!selectedId);
  }
}

function updateNodes() {
  compounds.forEach(c => {
    const el = document.getElementById('node-'+c.id);
    if (!el) return;
    el.classList.remove('active','highlighted','dimmed','quiz-hidden','quiz-revealed');
    const color = catColors[c.cat]||'#4f9cf9';
    if (quizMode) {
      if (quizRevealed.has(c.id)) el.classList.add('quiz-revealed');
      else el.classList.add('quiz-hidden');
    }
    if (selectedId) {
      if (c.id===selectedId) { el.classList.add('active'); el.style.borderColor=color; }
      else {
        const rel = reactions.some(r=>(r.from===selectedId&&r.to===c.id)||(r.to===selectedId&&r.from===c.id));
        if (rel) { el.classList.add('highlighted'); el.style.borderColor=color+'aa'; }
        else { el.classList.add('dimmed'); el.style.borderColor=color+'44'; }
      }
    } else { el.style.borderColor=color+'66'; }
  });
}

// ===================== SHEETS =====================
function openSheet(type, id) {
  const sheet = document.getElementById('bottomSheet');
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('sheetTitle');
  const body = document.getElementById('sheetBody');
  currentSheet = type;

  if (type==='detail' && id) {
    title.textContent = '';
    body.innerHTML = buildDetailHTML(id);
  } else if (type==='list') {
    title.textContent = '化合物一覧';
    body.innerHTML = buildListHTML();
  }

  sheet.classList.add('open');
  overlay.classList.add('open');
}

function closeSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  currentSheet = null;
  document.getElementById('navMap').classList.add('active');
  document.getElementById('navList').classList.remove('active');
  document.getElementById('navDetail').classList.remove('active');
}

function switchTab(tab) {
  ['navMap','navList','navDetail','navQuiz'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (tab==='map') { closeSheet(); document.getElementById('navMap').classList.add('active'); }
  else if (tab==='list') { openSheet('list',null); document.getElementById('navList').classList.add('active'); }
  else if (tab==='detail') {
    if (selectedId) { openSheet('detail',selectedId); document.getElementById('navDetail').classList.add('active'); }
    else { closeSheet(); document.getElementById('navMap').classList.add('active'); }
  }
}

// ===================== DETAIL HTML =====================
function buildDetailHTML(id) {
  const c = compounds.find(c=>c.id===id);
  if (!c) return '';
  const color = catColors[c.cat]||'#4f9cf9';
  const fromR = reactions.filter(r=>r.from===id);
  const toR = reactions.filter(r=>r.to===id);
  const getName = cid => { const x=compounds.find(c=>c.id===cid); return x?x.name.replace('\n',' '):'?'; };
  const tc = t => 'type-'+t.replace(/\s/g,'');

  let fromHTML = fromR.map(r=>`
    <div class="reaction-card" onclick="selectCompound(${r.to});closeSheet();">
      <div>→ <span class="reaction-compound">${getName(r.to)}</span></div>
      <div class="reaction-reagent">${r.reagent}</div>
      <span class="reaction-type ${tc(r.type)}">${r.type}</span>
    </div>`).join('');

  let toHTML = toR.map(r=>`
    <div class="reaction-card" onclick="selectCompound(${r.from});closeSheet();">
      <div>← <span class="reaction-compound">${getName(r.from)}</span></div>
      <div class="reaction-reagent">${r.reagent}</div>
      <span class="reaction-type ${tc(r.type)}">${r.type}</span>
    </div>`).join('');

  return `<div class="detail-wrap">
    <div class="detail-top">
      <div class="detail-struct">${getStruct(c.id)}</div>
      <div class="detail-info">
        <div class="detail-num">#${c.id}</div>
        <div class="detail-name" style="color:${color}">${c.name.replace('\n','<br>')}</div>
        <div class="detail-formula">${c.formula||''}</div>
      </div>
    </div>
    <div class="detail-desc">${c.desc}</div>
    ${c.props?`<div class="detail-section-title">特徴・性質</div><div class="chips">${c.props.map(p=>`<span class="chip">${p}</span>`).join('')}</div>`:''}
    ${fromR.length?`<div class="detail-section-title" style="margin-top:8px">この物質から生成 (${fromR.length})</div>${fromHTML}`:''}
    ${toR.length?`<div class="detail-section-title" style="margin-top:8px">この物質を生成する反応 (${toR.length})</div>${toHTML}`:''}
  </div>`;
}

function buildListHTML() {
  return compounds.map(c => {
    const color = catColors[c.cat]||'#4f9cf9';
    return `<div class="compound-list-item${selectedId===c.id?' selected':''}" onclick="selectCompound(${c.id});closeSheet();">
      <div class="cli-num" style="background:${color}22;color:${color};border:1px solid ${color}44">${c.id}</div>
      <div class="cli-struct">${getStruct(c.id)}</div>
      <div class="cli-name">${c.name.replace('\n',' ')}</div>
    </div>`;
  }).join('');
}

function renderDesktopDetail(id) {
  const el = document.getElementById('desktopDetail');
  if (!el) return;
  if (!id) { el.innerHTML = '<div style="color:var(--text-faint);font-size:12px;text-align:center;padding-top:40px;">化合物をクリック</div>'; return; }
  const html = buildDetailHTML(id).replace(/onclick="selectCompound\((\d+)\);closeSheet\(\);"/g, 'onclick="selectCompound($1)"');
  el.innerHTML = html;
}

function applyTransform() {
  document.getElementById('mapPan').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;

function clampPan() {
  const wrap = document.getElementById('mapWrap');
  const maxX = 100, maxY = 100;
  const minX = wrap.clientWidth - 1440*scale - 100;
  const minY = wrap.clientHeight - 1120*scale - 100;
  panX = Math.min(maxX, Math.max(minX, panX));
  panY = Math.min(maxY, Math.max(minY, panY));
}

function initPanZoom() {
  const wrap = document.getElementById('mapWrap');
  
  // Set initial scale to fit
  const scaleX = wrap.clientWidth / 1440;
  const scaleY = wrap.clientHeight / 1120;
  scale = Math.min(scaleX, scaleY) * 0.92;
  panX = (wrap.clientWidth - 1440*scale)/2;
  panY = (wrap.clientHeight - 1120*scale)/2;
  applyTransform();

  // Mouse
  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.node')) return;
    isPanning = true;
    startPan = {x:panX, y:panY};
    startPos = {x:e.clientX, y:e.clientY};
    wrap.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = startPan.x + (e.clientX-startPos.x);
    panY = startPan.y + (e.clientY-startPos.y);
    clampPan(); applyTransform();
  });
  window.addEventListener('mouseup', () => { isPanning = false; wrap.style.cursor = ''; });

  // Wheel zoom
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    const newScale = Math.min(2, Math.max(0.2, scale*delta));
    panX = mx - (mx-panX)*(newScale/scale);
    panY = my - (my-panY)*(newScale/scale);
    scale = newScale;
    clampPan(); applyTransform();
  }, {passive:false});

  // Touch
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length===1) {
      const t = e.touches[0];
      if (t.target.closest('.node')) return;
      isPanning = true;
      startPan = {x:panX,y:panY};
      startPos = {x:t.clientX,y:t.clientY};
    } else if (e.touches.length===2) {
      isPanning = false;
      const dx = e.touches[0].clientX-e.touches[1].clientX;
      const dy = e.touches[0].clientY-e.touches[1].clientY;
      pinchDist = Math.sqrt(dx*dx+dy*dy);
      lastTouch = {scale,panX,panY,mx:(e.touches[0].clientX+e.touches[1].clientX)/2,my:(e.touches[0].clientY+e.touches[1].clientY)/2};
    }
  }, {passive:true});

  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length===1 && isPanning) {
      const t = e.touches[0];
      panX = startPan.x+(t.clientX-startPos.x);
      panY = startPan.y+(t.clientY-startPos.y);
      clampPan(); applyTransform();
    } else if (e.touches.length===2 && pinchDist && lastTouch) {
      const dx = e.touches[0].clientX-e.touches[1].clientX;
      const dy = e.touches[0].clientY-e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const ratio = dist/pinchDist;
      const newScale = Math.min(2, Math.max(0.2, lastTouch.scale*ratio));
      const rect = wrap.getBoundingClientRect();
      const mx = lastTouch.mx-rect.left, my = lastTouch.my-rect.top;
      panX = mx-(mx-lastTouch.panX)*(newScale/lastTouch.scale);
      panY = my-(my-lastTouch.panY)*(newScale/lastTouch.scale);
      scale = newScale;
      clampPan(); applyTransform();
    }
  }, {passive:false});

  wrap.addEventListener('touchend', e => {
    if (e.touches.length<2) { pinchDist=null; lastTouch=null; }
    if (e.touches.length===0) isPanning=false;
  });
}

// ===================== QUIZ =====================
function toggleQuiz() {
  quizMode = !quizMode;
  quizRevealed.clear();
  const badge = document.getElementById('modeBadge');
  const btn = document.getElementById('quizBtn');
  const navQ = document.getElementById('navQuiz');
  if (quizMode) {
    badge.textContent='穴埋め';badge.style.background='rgba(251,191,36,0.15)';badge.style.color='#fbbf24';badge.style.borderColor='rgba(251,191,36,0.3)';
    btn.classList.add('active'); if(navQ) navQ.classList.add('active');
    compounds.forEach(c=>{const el=document.getElementById('node-'+c.id);if(el)el.classList.add('quiz-hidden');});
  } else {
    badge.textContent='閲覧';badge.style.background='rgba(52,211,153,0.15)';badge.style.color='#34d399';badge.style.borderColor='rgba(52,211,153,0.3)';
    btn.classList.remove('active'); if(navQ) navQ.classList.remove('active');
    compounds.forEach(c=>{const el=document.getElementById('node-'+c.id);if(el){el.classList.remove('quiz-hidden','quiz-revealed');}});
  }
}

function resetView() {
  selectedId=null; quizMode=false; quizRevealed.clear();
  const badge=document.getElementById('modeBadge');
  badge.textContent='閲覧';badge.style.background='rgba(52,211,153,0.15)';badge.style.color='#34d399';badge.style.borderColor='rgba(52,211,153,0.3)';
  document.getElementById('quizBtn').classList.remove('active');
  const navQ=document.getElementById('navQuiz');if(navQ)navQ.classList.remove('active');
  compounds.forEach(c=>{
    const el=document.getElementById('node-'+c.id);if(!el)return;
    el.classList.remove('quiz-hidden','quiz-revealed','active','highlighted','dimmed');
    el.style.borderColor=(catColors[c.cat]||'#4f9cf9')+'66';
  });
  closeSheet(); closeSidePanel(); renderArrows();
  if(isDesktop()){renderDesktopDetail(null);renderDesktopList();}
}

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded', () => {
  renderNodes();
  setupLayout();
  initPanZoom();
  setTimeout(renderArrows, 150);
  document.getElementById('navMap').classList.add('active');
});

window.addEventListener('resize', () => {
  setupLayout();
  // Re-fit on orientation change
  const wrap = document.getElementById('mapWrap');
  const scaleX = wrap.clientWidth/1440, scaleY = wrap.clientHeight/1120;
  scale = Math.min(scaleX,scaleY)*0.92;
  panX = (wrap.clientWidth-1440*scale)/2;
  panY = (wrap.clientHeight-1120*scale)/2;
  applyTransform();
  setTimeout(renderArrows,100);
});
</script>
