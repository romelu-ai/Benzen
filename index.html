<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芳香族化合物の反応系統図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --card: #1a2235;
    --card-hover: #1e2a40;
    --border: #2a3550;
    --accent: #4f9cf9;
    --accent2: #f97316;
    --accent3: #34d399;
    --accent4: #a78bfa;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-faint: #4a5568;
    --reaction-color: #f97316;
    --highlight: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(90deg, #4f9cf9, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.02em;
  }

  .header-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--accent); }
  .btn.active { background: #1e3a5f; color: var(--accent); border-color: var(--accent); }

  /* Layout */
  .main {
    display: flex;
    height: calc(100vh - 60px);
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-section {
    margin-bottom: 4px;
  }

  .sidebar-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    padding: 4px 6px;
    margin-bottom: 4px;
  }

  .compound-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .compound-item:hover { background: var(--card-hover); border-color: var(--border); }
  .compound-item.selected { background: #1e3a5f; border-color: var(--accent); }

  .compound-num {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .compound-name-small {
    font-size: 12px;
    color: var(--text);
    line-height: 1.3;
  }

  /* Map area */
  .map-container {
    flex: 1;
    overflow: auto;
    position: relative;
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(79,156,249,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,0.04) 0%, transparent 50%);
  }

  .map-canvas {
    position: relative;
    width: 1400px;
    height: 1080px;
    margin: 20px;
  }

  /* SVG arrows */
  .arrows-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Compound nodes */
  .node {
    position: absolute;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 90px;
    text-align: center;
    z-index: 10;
    user-select: none;
  }
  .node:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(79,156,249,0.2);
    z-index: 20;
  }
  .node.active {
    border-color: var(--accent);
    background: #1a2f50;
    box-shadow: 0 0 0 3px rgba(79,156,249,0.3), 0 8px 24px rgba(79,156,249,0.2);
    z-index: 30;
  }
  .node.highlighted {
    border-color: var(--accent3);
    box-shadow: 0 0 0 2px rgba(52,211,153,0.3);
  }
  .node.dimmed {
    opacity: 0.3;
  }

  .node-num {
    font-size: 9px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 3px;
  }
  .node-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .node-formula {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Detail panel */
  .detail-panel {
    width: 320px;
    min-width: 320px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: all 0.3s;
  }

  .detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-faint);
    text-align: center;
    gap: 12px;
    font-size: 13px;
  }

  .detail-empty .icon {
    font-size: 40px;
    opacity: 0.3;
  }

  .detail-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  .detail-num {
    font-size: 11px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 4px;
  }

  .detail-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .detail-alias {
    font-size: 12px;
    color: var(--text-dim);
  }

  .detail-formula-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent4);
    text-align: center;
  }

  .detail-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .reaction-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reaction-card:hover { border-color: var(--accent2); background: var(--card-hover); }

  .reaction-arrow { color: var(--accent2); font-size: 14px; margin: 0 4px; }

  .reaction-compound { 
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
  }

  .reaction-type {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 5px;
  }

  .reaction-reagent {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Reaction type colors */
  .type-置換 { background: rgba(79,156,249,0.15); color: #4f9cf9; }
  .type-ニトロ化 { background: rgba(249,115,22,0.15); color: #f97316; }
  .type-スルホン化 { background: rgba(52,211,153,0.15); color: #34d399; }
  .type-還元 { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .type-酸化 { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-中和 { background: rgba(244,114,182,0.15); color: #f472b6; }
  .type-エステル化 { background: rgba(45,212,191,0.15); color: #2dd4bf; }
  .type-アセチル化 { background: rgba(251,113,133,0.15); color: #fb7185; }
  .type-ジアゾ化 { background: rgba(99,102,241,0.15); color: #818cf8; }
  .type-付加 { background: rgba(234,179,8,0.15); color: #eab308; }
  .type-付加重合 { background: rgba(234,179,8,0.15); color: #eab308; }
  .type-縮合重合 { background: rgba(234,179,8,0.15); color: #eab308; }
  .type-アルキル化 { background: rgba(16,185,129,0.15); color: #10b981; }
  .type-アルカリ融解 { background: rgba(239,68,68,0.15); color: #ef4444; }
  .type-弱酸遊離 { background: rgba(20,184,166,0.15); color: #14b8a6; }
  .type-弱塩基遊離 { background: rgba(20,184,166,0.15); color: #14b8a6; }
  .type-ジアゾカップリング { background: rgba(99,102,241,0.15); color: #818cf8; }
  .type-酸化開裂 { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-加水分解 { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .type-分子内脱水 { background: rgba(156,163,175,0.15); color: #9ca3af; }

  /* Color categories for nodes */
  .cat-benzene { border-color: #4f9cf9; }
  .cat-phenol { border-color: #34d399; }
  .cat-aniline { border-color: #f97316; }
  .cat-acid { border-color: #a78bfa; }
  .cat-polymer { border-color: #fbbf24; }

  /* Info chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .chip {
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  /* Arrow path colors */
  .arrow-default { stroke: #2a3550; }
  .arrow-active { stroke: #4f9cf9; }
  .arrow-to-active { stroke: #34d399; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3550; border-radius: 3px; }

  /* Mode toggle */
  .mode-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(52,211,153,0.15);
    color: #34d399;
    border: 1px solid rgba(52,211,153,0.3);
  }

  /* Quiz mode */
  .node.quiz-hidden .node-name { 
    background: var(--border); 
    color: transparent;
    border-radius: 4px;
    user-select: none;
  }
  .node.quiz-revealed .node-name {
    color: var(--highlight);
  }

  /* Tooltip for arrows */
  .arrow-label {
    position: absolute;
    background: #1a2235ee;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 10px;
    color: var(--text-dim);
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
    display: none;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .detail-panel { width: 260px; min-width: 260px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧪 芳香族化合物の反応系統図</h1>
  <div class="header-controls">
    <span class="mode-badge" id="modeBadge">閲覧モード</span>
    <button class="btn" id="quizBtn" onclick="toggleQuiz()">📝 穴埋めモード</button>
    <button class="btn" id="showAllBtn" onclick="showAll()">全て表示</button>
    <button class="btn" id="resetBtn" onclick="resetView()">リセット</button>
  </div>
</div>

<div class="main">
  <!-- Sidebar: compound list -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">化合物一覧 (クリックで選択)</div>
    <div id="compoundList"></div>
  </div>

  <!-- Map -->
  <div class="map-container" id="mapContainer">
    <div class="map-canvas" id="mapCanvas">
      <svg class="arrows-svg" id="arrowsSvg">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2a3550"/>
          </marker>
          <marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f9cf9"/>
          </marker>
          <marker id="arrowhead-to" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
          </marker>
        </defs>
      </svg>
      <!-- Nodes rendered by JS -->
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty" id="detailEmpty">
      <div class="icon">⚗️</div>
      <div>化合物をクリックすると<br>詳細が表示されます</div>
    </div>
    <div id="detailContent" style="display:none"></div>
  </div>
</div>

<script>
// ===== DATA =====
const compounds = [
  { id:1,  name:'ベンゼン', formula:'C₆H₆', cat:'benzene', x:680, y:200, desc:'芳香族炭化水素の基本骨格。無色の液体。', props:['無色液体','有毒','発がん性','沸点80℃'] },
  { id:2,  name:'ベンゼンスルホン酸', formula:'C₆H₅SO₃H', cat:'acid', x:520, y:200, desc:'ベンゼンにH₂SO₄を反応させて得られる強酸。水に易溶。', props:['強酸性','水溶性'] },
  { id:3,  name:'ベンゼンスルホン酸\nナトリウム', formula:'C₆H₅SO₃Na', cat:'acid', x:370, y:200, desc:'ベンゼンスルホン酸のナトリウム塩。アルカリ融解でフェノールが得られる。', props:['ナトリウム塩','水溶性'] },
  { id:4,  name:'クロロベンゼン', formula:'C₆H₅Cl', cat:'benzene', x:680, y:360, desc:'ベンゼンに鉄粉触媒でCl₂を反応させた置換生成物。', props:['ハロゲン化合物'] },
  { id:5,  name:'クロロベンゼン', formula:'C₆H₅Cl', cat:'benzene', x:500, y:340, desc:'クロロベンゼン（NaOHaqで高温・高圧反応でフェノール生成）', props:['高温・高圧でフェノール製造'] },
  { id:6,  name:'フェノール', formula:'C₆H₅OH', cat:'phenol', x:230, y:310, desc:'ベンゼン環にOH基が付いた化合物。弱酸性。NaOHと反応するが、CO₂には遊離される。', props:['弱酸性','殺菌作用','水に微溶','石炭酸とも呼ばれる'] },
  { id:7,  name:'クメン', formula:'C₆H₅CH(CH₃)₂', cat:'benzene', x:870, y:200, desc:'ベンゼンにプロペンを付加したアルキルベンゼン。クメン法でフェノールを製造。', props:['アルキルベンゼン'] },
  { id:8,  name:'クメンヒドロ\nペルオキシド', formula:'C₆H₅C(CH₃)₂OOH', cat:'benzene', x:870, y:100, desc:'クメンをO₂で酸化した過酸化物。H₂SO₄で分解するとフェノールとアセトンが生成。', props:['過酸化物','クメン法中間体'] },
  { id:9,  name:'アセトン', formula:'CH₃COCH₃', cat:'acid', x:700, y:90, desc:'クメン法でフェノールと同時に生成されるケトン。汎用溶媒。', props:['ケトン','沸点56℃','水と混合'] },
  { id:10, name:'2,4,6-トリブロモ\nフェノール', formula:'C₆H₂Br₃OH', cat:'phenol', x:80, y:200, desc:'フェノールにBr₂水を加えると即座に白色沈殿として生成。フェノールの検出反応。', props:['白色沈殿','フェノール検出','殺菌剤'] },
  { id:11, name:'2,4,6-トリニトロ\nフェノール（ピクリン酸）', formula:'C₆H₂(NO₂)₃OH', cat:'phenol', x:80, y:340, desc:'フェノールを混酸でニトロ化した黄色固体。爆発物。別名ピクリン酸。', props:['黄色固体','爆発物','強酸性'] },
  { id:12, name:'酢酸フェニル', formula:'C₆H₅OOCCH₃', cat:'phenol', x:100, y:430, desc:'フェノールと無水酢酸のアセチル化で生成するエステル。', props:['エステル'] },
  { id:13, name:'ナトリウムフェノキシド', formula:'C₆H₅ONa', cat:'phenol', x:230, y:430, desc:'フェノールにNaOH水溶液を反応させた塩。CO₂・H₂Oでフェノールが遊離。', props:['強塩基で中和','弱酸の塩'] },
  { id:14, name:'サリチル酸ナトリウム', formula:'HOC₆H₄COONa', cat:'acid', x:70, y:560, desc:'ナトリウムフェノキシドにCO₂を高温高圧で反応（コルベ・シュミット反応）したサリチル酸のナトリウム塩。', props:['コルベ・シュミット','解熱鎮痛'] },
  { id:15, name:'サリチル酸', formula:'HOC₆H₄COOH', cat:'acid', x:70, y:680, desc:'フェノール性OH基とカルボキシ基を持つ化合物。鎮痛剤の原料。', props:['二官能性','鎮痛剤原料','弱酸性'] },
  { id:16, name:'サリチル酸メチル', formula:'HOC₆H₄COOCH₃', cat:'acid', x:200, y:720, desc:'サリチル酸とメタノールのエステル化。消炎鎮痛作用あり。', props:['エステル','消炎鎮痛','湿布薬'] },
  { id:17, name:'アセチルサリチル酸', formula:'CH₃COOC₆H₄COOH', cat:'acid', x:70, y:820, desc:'サリチル酸と無水酢酸のアセチル化。アスピリンとも呼ばれる解熱鎮痛剤。', props:['アスピリン','解熱鎮痛','エステル'] },
  { id:18, name:'ニトロベンゼン', formula:'C₆H₅NO₂', cat:'benzene', x:760, y:360, desc:'ベンゼンに混酸（HNO₃+H₂SO₄）を反応させたニトロ化合物。淡黄色の液体。', props:['淡黄色液体','有毒','還元するとアニリン'] },
  { id:19, name:'アニリン塩酸塩', formula:'C₆H₅NH₃Cl', cat:'aniline', x:760, y:500, desc:'アニリンに塩酸を加えた塩。NaOHで弱塩基（アニリン）が遊離。', props:['塩','水溶性'] },
  { id:20, name:'アニリン', formula:'C₆H₅NH₂', cat:'aniline', x:640, y:500, desc:'ニトロベンゼンを還元（HCl, Sn）して得られる。弱塩基性。ジアゾ化の原料。', props:['弱塩基性','無色→暗褐色','有毒','染料原料'] },
  { id:21, name:'アセトアニリド', formula:'C₆H₅NHCOCH₃', cat:'aniline', x:780, y:640, desc:'アニリンと無水酢酸のアセチル化。解熱鎮痛作用（フェナセチン前駆体）。', props:['アセトアミド','解熱鎮痛','染料中間体'] },
  { id:22, name:'塩化ベンゼンジアゾニウム', formula:'C₆H₅N₂Cl', cat:'aniline', x:440, y:500, desc:'アニリンをHCl/NaNO₂で5℃以下でジアゾ化した化合物。不安定。カップリング反応の原料。', props:['不安定','5℃以下','アゾ染料原料'] },
  { id:23, name:'p-フェニルアゾフェノール\n(p-ヒドロキシアゾベンゼン)', formula:'HOC₆H₄N=NC₆H₅', cat:'aniline', x:350, y:620, desc:'塩化ベンゼンジアゾニウムとナトリウムフェノキシドのジアゾカップリング。橙赤色のアゾ染料。', props:['アゾ染料','橙赤色','アゾ結合 -N=N-'] },

// State
let selectedId = null;
let quizMode = false;
let quizRevealed = new Set();

// Category colors
const catColors = {
  benzene: '#4f9cf9',
  phenol: '#34d399',
  aniline: '#f97316',
  acid: '#a78bfa',
  polymer: '#fbbf24',
};

function getCenter(node) {
  const el = document.getElementById('node-' + node.id);
  if (!el) return { x: node.x + 55, y: node.y + 30 };
  const rect = el.getBoundingClientRect();
  const canvas = document.getElementById('mapCanvas').getBoundingClientRect();
  return {
    x: node.x + el.offsetWidth / 2,
    y: node.y + el.offsetHeight / 2,
  };
}

function renderSidebar() {
  const list = document.getElementById('compoundList');
  list.innerHTML = '';
  compounds.forEach(c => {
    const div = document.createElement('div');
    div.className = 'compound-item' + (selectedId === c.id ? ' selected' : '');
    div.id = 'sidebar-' + c.id;
    div.onclick = () => selectCompound(c.id);
    const color = catColors[c.cat] || '#4f9cf9';
    div.innerHTML = `
      <div class="compound-num" style="background:${color}22; color:${color}; border:1px solid ${color}44">${c.id}</div>
      <div class="compound-name-small">${c.name.replace('\n', ' ')}</div>
    `;
    list.appendChild(div);
  });
}

function renderNodes() {
  const canvas = document.getElementById('mapCanvas');
  compounds.forEach(c => {
    const div = document.createElement('div');
    div.className = 'node cat-' + c.cat;
    div.id = 'node-' + c.id;
    div.style.left = c.x + 'px';
    div.style.top = c.y + 'px';
    const color = catColors[c.cat] || '#4f9cf9';
    div.style.borderColor = color + '55';
    div.innerHTML = `
      <div class="node-num">#${c.id}</div>
      <div class="node-name">${c.name.replace('\n','<br>')}</div>
      ${c.formula ? `<div class="node-formula">${c.formula}</div>` : ''}
    `;
    div.onclick = () => selectCompound(c.id);
    canvas.appendChild(div);
  });
}

function renderArrows() {
  const svg = document.getElementById('arrowsSvg');
  // Clear existing paths
  while (svg.children.length > 1) svg.removeChild(svg.lastChild);

  reactions.forEach(r => {
    const fromC = compounds.find(c => c.id === r.from);
    const toC = compounds.find(c => c.id === r.to);
    if (!fromC || !toC) return;

    const fromEl = document.getElementById('node-' + fromC.id);
    const toEl = document.getElementById('node-' + toC.id);
    if (!fromEl || !toEl) return;

    const fx = fromC.x + fromEl.offsetWidth / 2;
    const fy = fromC.y + fromEl.offsetHeight / 2;
    const tx = toC.x + toEl.offsetWidth / 2;
    const ty = toC.y + toEl.offsetHeight / 2;

    const dx = tx - fx;
    const dy = ty - fy;
    const len = Math.sqrt(dx*dx + dy*dy);
    
    // Offset from center to edge
    const fromR = 45;
    const toR = 48;
    
    const sx = fx + (dx/len) * fromR;
    const sy = fy + (dy/len) * fromR;
    const ex = tx - (dx/len) * toR;
    const ey = ty - (dy/len) * toR;

    // Bezier control
    const mx = (sx + ex) / 2;
    const my = (sy + ey) / 2;
    const perp = 20;
    const cpx = mx - (dy/len) * perp;
    const cpy = my + (dx/len) * perp;

    const isFromActive = selectedId === fromC.id;
    const isToActive = selectedId === toC.id;
    const isRelated = isFromActive || isToActive;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('data-reaction', r.num);
    g.style.cursor = 'pointer';

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${sx} ${sy} Q ${cpx} ${cpy} ${ex} ${ey}`);
    path.setAttribute('fill', 'none');
    
    let color = '#2a3550';
    let width = '1.5';
    let marker = 'url(#arrowhead)';
    
    if (isFromActive) { color = '#4f9cf9'; width = '2.5'; marker = 'url(#arrowhead-active)'; }
    else if (isToActive) { color = '#34d399'; width = '2.5'; marker = 'url(#arrowhead-to)'; }
    
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', width);
    path.setAttribute('marker-end', marker);
    path.setAttribute('opacity', selectedId && !isRelated ? '0.15' : '0.7');
    g.appendChild(path);

    // Label on path
    if (isRelated) {
      const lx = (sx + ex) / 2;
      const ly = (sy + ey) / 2 - 8;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', lx);
      text.setAttribute('y', ly);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '9');
      text.setAttribute('fill', isFromActive ? '#4f9cf9' : '#34d399');
      text.setAttribute('font-family', 'Noto Sans JP, sans-serif');
      text.textContent = r.type;
      g.appendChild(text);
    }

    svg.appendChild(g);
  });
}

function selectCompound(id) {
  if (quizMode) {
    quizRevealed.add(id);
  }
  selectedId = id === selectedId ? null : id;
  updateAll();
  if (selectedId) showDetail(selectedId);
  else showEmpty();
  // Scroll sidebar
  if (selectedId) {
    const el = document.getElementById('sidebar-' + selectedId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function updateAll() {
  // Update node styles
  compounds.forEach(c => {
    const el = document.getElementById('node-' + c.id);
    if (!el) return;
    const color = catColors[c.cat] || '#4f9cf9';
    el.classList.remove('active', 'highlighted', 'dimmed');
    
    if (quizMode) {
      const nameEl = el.querySelector('.node-name');
      if (quizRevealed.has(c.id)) {
        el.classList.remove('quiz-hidden');
        el.classList.add('quiz-revealed');
      } else {
        el.classList.add('quiz-hidden');
        el.classList.remove('quiz-revealed');
      }
    }

    if (selectedId) {
      if (c.id === selectedId) {
        el.classList.add('active');
        el.style.borderColor = color;
      } else {
        const related = reactions.some(r => 
          (r.from === selectedId && r.to === c.id) ||
          (r.to === selectedId && r.from === c.id)
        );
        if (related) {
          el.classList.add('highlighted');
          el.style.borderColor = color + 'aa';
        } else {
          el.classList.add('dimmed');
          el.style.borderColor = color + '55';
        }
      }
    } else {
      el.style.borderColor = color + '55';
    }
  });

  // Update sidebar
  document.querySelectorAll('.compound-item').forEach(el => el.classList.remove('selected'));
  if (selectedId) {
    const sel = document.getElementById('sidebar-' + selectedId);
    if (sel) sel.classList.add('selected');
  }

  renderArrows();
}

function showDetail(id) {
  const c = compounds.find(c => c.id === id);
  if (!c) return;

  document.getElementById('detailEmpty').style.display = 'none';
  const content = document.getElementById('detailContent');
  content.style.display = 'block';

  const fromReactions = reactions.filter(r => r.from === id);
  const toReactions = reactions.filter(r => r.to === id);

  const getCompoundName = (cid) => {
    const comp = compounds.find(x => x.id === cid);
    return comp ? comp.name.replace('\n',' ') : '?';
  };

  const getTypeClass = (type) => {
    return 'type-' + type.replace(/\s/g,'');
  };

  let fromHTML = fromReactions.map(r => {
    const toName = getCompoundName(r.to);
    return `<div class="reaction-card" onclick="selectCompound(${r.to})">
      <div style="font-size:11px; color:var(--text-dim)">→ <span class="reaction-compound">${toName}</span></div>
      <div class="reaction-reagent">${r.reagent}</div>
      <span class="reaction-type ${getTypeClass(r.type)}">${r.type}</span>
    </div>`;
  }).join('');

  let toHTML = toReactions.map(r => {
    const fromName = getCompoundName(r.from);
    return `<div class="reaction-card" onclick="selectCompound(${r.from})">
      <div style="font-size:11px; color:var(--text-dim)">← <span class="reaction-compound">${fromName}</span></div>
      <div class="reaction-reagent">${r.reagent}</div>
      <span class="reaction-type ${getTypeClass(r.type)}">${r.type}</span>
    </div>`;
  }).join('');

  const color = catColors[c.cat] || '#4f9cf9';

  content.innerHTML = `
    <div class="detail-header">
      <div class="detail-num">#${c.id}</div>
      <div class="detail-name" style="color:${color}">${c.name.replace('\n','<br>')}</div>
      ${c.formula ? `<div class="detail-alias" style="font-family:monospace">${c.formula}</div>` : ''}
    </div>
    
    <div>
      <div class="detail-section-title">説明</div>
      <div style="font-size:13px; color:var(--text-dim); line-height:1.7">${c.desc}</div>
    </div>

    ${c.props ? `<div>
      <div class="detail-section-title">特徴・性質</div>
      <div class="chips">${c.props.map(p => `<span class="chip">${p}</span>`).join('')}</div>
    </div>` : ''}

    ${fromReactions.length > 0 ? `<div>
      <div class="detail-section-title">この物質から生成される化合物 (${fromReactions.length})</div>
      ${fromHTML}
    </div>` : ''}

    ${toReactions.length > 0 ? `<div>
      <div class="detail-section-title">この物質を生成する反応 (${toReactions.length})</div>
      ${toHTML}
    </div>` : ''}
  `;
}

function showEmpty() {
  document.getElementById('detailEmpty').style.display = 'flex';
  document.getElementById('detailContent').style.display = 'none';
}

function toggleQuiz() {
  quizMode = !quizMode;
  quizRevealed.clear();
  if (quizMode) {
    document.getElementById('quizBtn').classList.add('active');
    document.getElementById('modeBadge').textContent = '穴埋めモード';
    document.getElementById('modeBadge').style.background = 'rgba(251,191,36,0.15)';
    document.getElementById('modeBadge').style.color = '#fbbf24';
    document.getElementById('modeBadge').style.borderColor = 'rgba(251,191,36,0.3)';
    // Hide all names
    compounds.forEach(c => {
      const el = document.getElementById('node-' + c.id);
      if (el) el.classList.add('quiz-hidden');
    });
  } else {
    document.getElementById('quizBtn').classList.remove('active');
    document.getElementById('modeBadge').textContent = '閲覧モード';
    document.getElementById('modeBadge').style.background = 'rgba(52,211,153,0.15)';
    document.getElementById('modeBadge').style.color = '#34d399';
    document.getElementById('modeBadge').style.borderColor = 'rgba(52,211,153,0.3)';
    compounds.forEach(c => {
      const el = document.getElementById('node-' + c.id);
      if (el) { el.classList.remove('quiz-hidden'); el.classList.remove('quiz-revealed'); }
    });
  }
}

function showAll() {
  if (quizMode) {
    compounds.forEach(c => quizRevealed.add(c.id));
    compounds.forEach(c => {
      const el = document.getElementById('node-' + c.id);
      if (el) { el.classList.remove('quiz-hidden'); el.classList.add('quiz-revealed'); }
    });
  }
}

function resetView() {
  selectedId = null;
  quizMode = false;
  quizRevealed.clear();
  document.getElementById('quizBtn').classList.remove('active');
  document.getElementById('modeBadge').textContent = '閲覧モード';
  document.getElementById('modeBadge').style.background = 'rgba(52,211,153,0.15)';
  document.getElementById('modeBadge').style.color = '#34d399';
  document.getElementById('modeBadge').style.borderColor = 'rgba(52,211,153,0.3)';
  compounds.forEach(c => {
    const el = document.getElementById('node-' + c.id);
    if (el) {
      el.classList.remove('quiz-hidden', 'quiz-revealed', 'active', 'highlighted', 'dimmed');
      const color = catColors[c.cat] || '#4f9cf9';
      el.style.borderColor = color + '55';
    }
  });
  showEmpty();
  renderArrows();
  renderSidebar();
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  renderNodes();
  renderSidebar();
  // Delay arrow rendering to let nodes layout
  setTimeout(renderArrows, 100);
});

window.addEventListener('resize', () => {
  setTimeout(renderArrows, 50);
});
